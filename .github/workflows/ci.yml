name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Race and integration tests
        run: go test -race -cover ./...
      - name: Check frontend syntax
        run: node --check static/app.js
      - name: Check module integrity
        run: go mod verify
      - name: Check known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build and verify container
        run: |
          docker build -t leafmark:ci .
          ./scripts/smoke-container.sh leafmark:ci
