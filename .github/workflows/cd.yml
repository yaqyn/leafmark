name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build production binary
        run: ./scripts/buildprod.sh

      - name: Simulate Cloud Build locally (no Google upload)
        run: |
          export PATH="$PWD/scripts/local-cloud-simulation:$PATH"
          gcloud builds submit --tag us-central1-docker.pkg.dev/notely-511611/notely-ar-repo/notely:latest .
