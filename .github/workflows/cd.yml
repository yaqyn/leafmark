name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build production binary
        run: ./scripts/buildprod.sh

      - name: Build container image
        run: docker build -t "notely:${{ github.sha }}" .

      - name: Verify container HTTP endpoints
        run: ./scripts/smoke-container.sh "notely:${{ github.sha }}"
