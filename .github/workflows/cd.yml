name: container
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build release container
        run: docker build -t "leafmark:${{ github.sha }}" .
      - name: Verify release container
        run: ./scripts/smoke-container.sh "leafmark:${{ github.sha }}"
