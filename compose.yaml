services:
  leafmark:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      ALLOW_SIGNUP: "${ALLOW_SIGNUP:-true}"
      DATABASE_URL: "${DATABASE_URL:-}"
    volumes:
      - leafmark-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
volumes:
  leafmark-data:
